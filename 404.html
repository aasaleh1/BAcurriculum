<style>
:root{
  --paper:#FFFFFF; --card:#FFFFFF; --sunk:#F5F3EE;
  --ink:#141A22; --ink-2:#414D5C; --ink-3:#6D7889;
  --rule:#E2DED5; --rule-2:#CDC7B9;
  --ela:#1B365D; --math:#1B365D; --sci:#0F5257; --soc:#7A2E1F; --qais:#1F4D3A;
  --accent:#1B365D;
  --display:"Bricolage Grotesque",Georgia,serif;
  --sans:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 1px 2px rgba(20,26,34,.05), 0 14px 32px -20px rgba(20,26,34,.3);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11151A; --card:#1A2029; --sunk:#171C23;
    --ink:#EAE7E0; --ink-2:#B4BCC7; --ink-3:#86909F;
    --rule:#2A313B; --rule-2:#3B4552;
    --ela:#9DBBE0; --math:#9DBBE0; --sci:#59BDB2; --soc:#E09C84; --qais:#6FBF95;
    --accent:#9DBBE0;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 32px -20px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11151A; --card:#1A2029; --sunk:#171C23;
  --ink:#EAE7E0; --ink-2:#B4BCC7; --ink-3:#86909F;
  --rule:#2A313B; --rule-2:#3B4552;
  --ela:#9DBBE0; --math:#9DBBE0; --sci:#59BDB2; --soc:#E09C84; --qais:#6FBF95;
  --accent:#9DBBE0;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 32px -20px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance}
a{color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto;padding:40px 24px 80px}

/* masthead */
.masthead{border-bottom:2px solid var(--ink);padding-bottom:20px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kicker .dot{width:4px;height:4px;border-radius:50%;background:var(--rule-2)}
.masthead h1{font-size:clamp(34px,5.6vw,58px);line-height:.98;letter-spacing:-.025em;margin:14px 0 0}
.masthead h1 span{display:block;font-weight:700}
.deck{font-size:17px;color:var(--ink-2);max-width:60ch;margin:16px 0 0}

/* section labels */
.sec{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:500;color:var(--ink-3);margin:48px 0 16px;padding-bottom:8px;
  border-bottom:1px solid var(--rule)}

/* subject cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{--mark:var(--accent);
  position:relative;display:flex;flex-direction:column;gap:9px;
  background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--mark);
  border-radius:3px;padding:22px 24px 20px;text-decoration:none;color:inherit;
  transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--rule-2);
  border-left-color:var(--mark)}
.card:focus-visible{outline:2px solid var(--mark);outline-offset:3px}
.card .band{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--mark);font-weight:500}
.card h3{font-size:25px;line-height:1.08;letter-spacing:-.015em}
.card p{margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.5}
.card .meta{margin-top:auto;padding-top:12px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;color:var(--ink-3)}
.card .meta b{color:var(--mark);font-weight:500}
.card .meta .arw{transition:transform .14s ease}
.card:hover .meta .arw{transform:translateX(3px)}
.card.ela{--mark:var(--ela)} .card.math{--mark:var(--math)} .card.sci{--mark:var(--sci)}
.card.soc{--mark:var(--soc)} .card.qais{--mark:var(--qais)}

/* sub-links under ELA */
.subs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sub{display:inline-flex;align-items:center;gap:7px;background:var(--sunk);
  border:1px solid var(--rule);border-radius:999px;padding:6px 14px;
  font-size:13px;color:var(--ink-2);text-decoration:none;transition:border-color .14s,color .14s}
.sub:hover{border-color:var(--rule-2);color:var(--ink)}
.sub:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sub .pip{width:5px;height:5px;border-radius:50%;background:var(--ela)}

/* how it works */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}
.note h3{font-size:18px;margin-bottom:6px;letter-spacing:-.01em}
.note p{margin:0;font-size:14.5px;color:var(--ink-2)}

footer{margin-top:52px;padding-top:18px;border-top:1px solid var(--rule);
  font-size:13.5px;color:var(--ink-3);max-width:74ch}
footer a{color:var(--ink-3)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){.wrap{padding:26px 16px 56px}body{font-size:15.5px}}
@media print{.card{break-inside:avoid;border-left-width:3px}}
</style>
</head>

    <div class="kicker"><span>Bayaan Academy</span><span class="dot"></span><span>Page not found</span></div>
